name: train_diffusion_unet_sim_hand
_target_: diffusion_policy.workspace.train_diffusion_unet_sim_hand_workspace.TrainDiffusionUnetSimHandWorkspace
task_name: ${task.name}
obs_dim: ${task.obs_dim}
action_dim: ${task.action_dim}
exp_name: default
n_obs_steps: 4
n_pred_action_steps: 9
n_action_steps: 5
horizon: ${eval:'${n_obs_steps}+${n_pred_action_steps}-1'}
obs_as_global_cond: true
oa_step_convention: true
policy:
  _target_: diffusion_policy.policy.diffusion_unet_sim_hand_policy.DiffusionUnetSimHandPolicy
  model:
    _target_: diffusion_policy.model.diffusion.conditional_unet1d.ConditionalUnet1D
    input_dim: ${action_dim}
    local_cond_dim: null
    global_cond_dim: ${eval:'${obs_dim}*${n_obs_steps}'}
    diffusion_step_embed_dim: 256
    down_dims:
    - 256
    - 512
    - 1024
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: true
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: true
    prediction_type: epsilon
  horizon: ${horizon}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  n_obs_steps: ${n_obs_steps}
  n_pred_action_steps: ${n_pred_action_steps}
  n_action_steps: ${n_action_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  oa_step_convention: ${oa_step_convention}
  return_full_prediction: false
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: false
val_dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: false
  pin_memory: true
  persistent_workers: false
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  weight_decay: 1.0e-06
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 1000
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: 1000000
  checkpoint_every: 100
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
logging:
  project: sim_hand_diffusion_policy
  resume: true
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags:
  - ${name}
  - ${task_name}
  - ${exp_name}
  id: null
  group: null
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
task:
  name: sim_hand_lowdim
  obs_dim: 22
  action_dim: 22
  dataset_path: /home/carus/Data/exp_data
  env_runner:
    _target_: diffusion_policy.env_runner.null_lowdim_runner.NullLowdimRunner
  dataset:
    _target_: diffusion_policy.dataset.sim_hand_lowdim_dataset.SimHandLowdimDataset
    dataset_path: ${task.dataset_path}
    horizon: ${horizon}
    pad_before: ${eval:'${n_obs_steps}-1'}
    pad_after: ${eval:'${n_pred_action_steps}-1'}
    seed: 42
    val_ratio: 0.1
    max_train_episodes: null
