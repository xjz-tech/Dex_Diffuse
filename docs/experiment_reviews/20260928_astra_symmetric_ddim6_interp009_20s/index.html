<article><h2>右转</h2><video id="right" controls preload="auto" playsinline src="right_comparison_1x.mp4"></video><p class="status" id="right-status">加载中</p><a href="right_comparison_1x.mp4" download>下载右转录像</a></article></section><p>每段四格顺序：左上 Direct，右上噪声 0.1，左下噪声 0.2，右下噪声 0.35。转角仅计算到最后确认仍握住的帧；掉落后的滚动不计作完成旋转。</p><h2>新增：noise 0.15 / DDIM4（新对称循环）</h2><video controls preload="metadata" playsinline src="noise015_ddim4_left_right_1x.mp4"></video><p>左侧左转，右侧右转；完整20秒，1倍速。<a href="noise015_ddim4_left_right_1x.mp4" download>下载新增录像</a> · <a href="COMPARISON_TABLE.md">完整合并表</a></p></main>
<script>const vs=[document.querySelector('#left'),document.querySelector('#right')];for(const v of vs){function update(){document.querySelector('#'+v.id+'-status').textContent=`${v.paused?'暂停':'播放中'} · ${v.currentTime.toFixed(2)} / ${Number.isFinite(v.duration)?v.duration.toFixed(2):'--'} 秒 · ${v.playbackRate} 倍速`;}v.addEventListener('loadedmetadata',()=>{v.playbackRate=1;update()});['timeupdate','play','pause','ratechange'].forEach(e=>v.addEventListener(e,update));v.addEventListener('error',()=>{document.querySelector('#'+v.id+'-status').textContent='播放器加载失败，请使用下方下载链接。'});}document.querySelector('#play').onclick=()=>{for(const v of vs){v.currentTime=0;v.playbackRate=1;v.play();}};document.querySelector('#pause').onclick=()=>vs.forEach(v=>v.pause());</script></html>
